plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.tlspin'
version = '0.1.0'

android {
  namespace "expo.modules.tlspin"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  implementation 'com.squareup.okhttp3:okhttp:4.9.2'
  implementation 'com.facebook.react:react-android'
}
